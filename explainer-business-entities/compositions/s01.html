<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/theme.css" />
      <style>
        #root { position: absolute; inset: 0; }
        #s01-open { position: absolute; inset: 0; }
        #s01-open .copy { position: absolute; left: 150px; top: 330px; width: 1200px; }
        #s01-open .title { font-size: 112px; margin-top: 28px; }
        #s01-open .lede { margin-top: 32px; }
        #s01-hook { position: absolute; left: 150px; top: 250px; width: 1620px; }
        #s01-hook .title { font-size: 120px; }
        #s01-chips { margin-top: 70px; display: flex; gap: 28px; }
        #s01-chips .chip { font-size: 34px; padding: 20px 34px; }
        #s01-agenda { position: absolute; left: 150px; top: 250px; width: 1620px; }
        #s01-cards { margin-top: 56px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
        #s01-cards .card { height: 380px; display: flex; flex-direction: column; justify-content: space-between; }
        #s01-cards .num { font-family: var(--serif); font-size: 120px; font-weight: 700; color: var(--amber); line-height: 1; }
      </style>
      <div id="root" data-composition-id="s01" data-width="1920" data-height="1080">
        <!-- Cold open: Kling plate -->
        <div id="s01-open">
          <video id="s01-plate" class="video-plate" src="assets/video/sign.mp4" data-start="0" data-duration="6" data-track-index="0" muted playsinline></video>
          <div class="shade"></div>
          <div class="copy">
            <div class="kicker">Entrepreneurship Fundamentals · §8–10</div>
            <h1 class="title">Business Entities, Governance &amp; Leverage</h1>
            <p class="lede">An exam study guide</p>
          </div>
        </div>

        <!-- Hook -->
        <div id="s01-hook" class="stage-block">
          <div class="kicker">Every venture starts with a choice</div>
          <h2 class="title" style="margin-top: 24px">The <span class="em">legal structure.</span></h2>
          <div id="s01-chips">
            <span class="chip red" id="s01-c1"><span class="dot"></span>Who is on the hook</span>
            <span class="chip amber" id="s01-c2"><span class="dot"></span>How profits are taxed</span>
            <span class="chip teal" id="s01-c3"><span class="dot"></span>Who makes decisions</span>
          </div>
        </div>

        <!-- Agenda -->
        <div id="s01-agenda">
          <div class="kicker">In this study guide</div>
          <h2 class="title-md" style="margin-top: 20px">Three things to know</h2>
          <div id="s01-cards">
            <div class="card" id="s01-a1"><div class="num">8</div><div><h3>Business Entities</h3><p>Sole proprietorships to PLLCs</p></div></div>
            <div class="card" id="s01-a2"><div class="num">9</div><div><h3>Governance &amp; Ownership</h3><p>How corporations and LLCs are run and owned</p></div></div>
            <div class="card" id="s01-a3"><div class="num">10</div><div><h3>Leverage, Supply Chain &amp; Bias</h3><p>Closing out the fundamentals</p></div></div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const V = 4.5; // voice-over start, scene-local seconds
          const D = 31.172; // scene duration (script/scene-times.json)
          const tl = gsap.timeline({ paused: true });

          // Cold open
          tl.fromTo("#s01-plate", { scale: 1.08 }, { scale: 1, duration: 6, ease: "none" }, 0);
          tl.fromTo("#s01-open .copy > *", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, stagger: 0.25, ease: "power3.out" }, 0.4);
          tl.to("#s01-open", { opacity: 0, duration: 0.7, ease: "power2.in" }, V + 0.4);

          // Hook
          tl.fromTo("#s01-hook .kicker", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6 }, V + 0.9);
          tl.fromTo("#s01-hook .title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, V + 3.8);
          tl.fromTo("#s01-c1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(2)" }, V + 6.0);
          tl.fromTo("#s01-c2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(2)" }, V + 8.6);
          tl.fromTo("#s01-c3", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(2)" }, V + 10.2);
          tl.to("#s01-hook", { opacity: 0, y: -30, duration: 0.5, ease: "power2.in" }, V + 12.0);

          // Agenda
          tl.fromTo("#s01-agenda .kicker, #s01-agenda .title-md", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, stagger: 0.12 }, V + 12.4);
          tl.fromTo("#s01-a1", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, V + 15.1);
          tl.fromTo("#s01-a2", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, V + 17.1);
          tl.fromTo("#s01-a3", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, V + 20.7);
          tl.to("#s01-a1", { borderColor: "#f5b041", y: -12, duration: 0.5 }, V + 24.9);
          tl.to("#s01-a2, #s01-a3", { opacity: 0.35, duration: 0.5 }, V + 24.9);

          tl.to("#s01-agenda", { opacity: 0, duration: 0.35 }, D - 0.4);
          window.__timelines["s01"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
