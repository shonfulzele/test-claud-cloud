<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/theme.css" />
      <style>
        #root { position: absolute; inset: 0; }
        #s05-split { position: absolute; left: 150px; top: 340px; width: 1620px; }
        #s05-bar { display: flex; height: 150px; border-radius: 20px; overflow: hidden; margin-top: 18px; }
        #s05-lp { width: 80%; background: rgba(79, 209, 197, 0.18); border: 2px solid var(--teal); border-radius: 20px 0 0 20px;
          display: flex; align-items: center; padding-left: 40px; box-sizing: border-box; gap: 24px; transform-origin: 0 50%; }
        #s05-gp { width: 20%; background: rgba(245, 176, 65, 0.2); border: 2px solid var(--amber); border-radius: 0 20px 20px 0;
          display: flex; align-items: center; justify-content: center; box-sizing: border-box; gap: 16px; transform-origin: 0 50%; }
        .s05-n { font-family: var(--serif); font-weight: 700; font-size: 80px; line-height: 1; }
        #s05-steps { position: absolute; left: 150px; top: 640px; width: 1620px; display: flex; align-items: stretch; gap: 22px; }
        #s05-steps .card { flex: 1; padding: 28px 30px; }
        #s05-steps .arr { align-self: center; font-size: 44px; color: var(--dim); }
        .s05-step { font-family: var(--mono); font-size: 18px; letter-spacing: 0.14em; color: var(--dim); margin-bottom: 10px; }
        #s05-hr .v { font-family: var(--serif); font-size: 54px; font-weight: 700; color: var(--amber); margin-top: 6px; }
        #s05-perf { position: absolute; right: 150px; top: 560px; }
      </style>
      <div id="root" data-composition-id="s05" data-width="1920" data-height="1080">
        <div class="hdr" id="s05-hdr">
          <div class="kicker">8b-ii · Carried interest</div>
          <h2 class="title-md">The 80 / 20 profit split</h2>
        </div>
        <div id="s05-split">
          <div class="label">Fund investment profits</div>
          <div id="s05-bar">
            <div id="s05-lp"><span class="s05-n teal">80%</span><span class="body" style="color: var(--ink)">to the Limited Partners</span></div>
            <div id="s05-gp"><span class="s05-n amber" style="font-size: 64px">20%</span><span class="body" style="color: var(--ink)">GP</span></div>
          </div>
        </div>
        <div id="s05-perf" class="chip amber">Performance-based</div>
        <div id="s05-steps">
          <div class="card" id="s05-s1"><div class="s05-step">STEP 1</div><h3>Return of capital</h3><p>LPs get their initial capital back first</p></div>
          <div class="arr" id="s05-a1">→</div>
          <div class="card" id="s05-hr"><div class="s05-step">STEP 2 · SOMETIMES</div><h3>Hurdle rate</h3><p>A predetermined minimum return</p><div class="v">7–10% / yr</div></div>
          <div class="arr" id="s05-a2">→</div>
          <div class="card hl" id="s05-s3"><div class="s05-step">STEP 3</div><h3>Then carry</h3><p>Only now does the GP earn its 20%</p></div>
        </div>
      </div>
      <script>
        (() => {
          const V = 0.5;
          const D = 25.948;
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s05-hdr > *", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, stagger: 0.12, ease: "power3.out" }, 0.1);
          tl.fromTo("#s05-split .label", { opacity: 0 }, { opacity: 1, duration: 0.4 }, V + 1.5);
          tl.fromTo("#s05-lp", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.9, ease: "power3.out" }, V + 3.7);
          tl.fromTo("#s05-gp", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, V + 6.7);
          tl.to("#s05-gp", { boxShadow: "0 0 50px rgba(245,176,65,0.5)", duration: 0.4 }, V + 8.6);
          tl.fromTo("#s05-perf", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4 }, V + 10.9);
          tl.fromTo("#s05-s1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5 }, V + 13.8);
          tl.fromTo("#s05-a1", { opacity: 0 }, { opacity: 1, duration: 0.3 }, V + 17.0);
          tl.fromTo("#s05-hr", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5 }, V + 17.3);
          tl.fromTo("#s05-hr .v", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, V + 22.4);
          tl.fromTo("#s05-a2", { opacity: 0 }, { opacity: 1, duration: 0.3 }, V + 19.9);
          tl.fromTo("#s05-s3", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5 }, V + 20.1);
          tl.to("#s05-hdr, #s05-split, #s05-perf, #s05-steps", { opacity: 0, duration: 0.35 }, D - 0.4);
          window.__timelines["s05"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
